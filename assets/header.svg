<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0f"/>
      <stop offset="100%" stop-color="#181114"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1000" height="200" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="994" height="194" rx="18" fill="none" stroke="#2a2320" stroke-width="1.5"/>
  <rect x="3" y="3" width="994" height="194" rx="18" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round" stroke-dasharray="140 2160" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2300" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Arthur Utida</text>
  <text x="500" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#F5A623" letter-spacing="1">Sistemas · Automacao · Integracoes</text>
</svg>
